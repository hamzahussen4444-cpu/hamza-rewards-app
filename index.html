<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamza Rewards</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="//libtl.com/sdk.js" data-zone="11961014" data-sdk="show_11961014"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding-bottom:80px}
    .app{max-width:480px;margin:0 auto;padding:16px}
    .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    .logo{width:45px;height:45px;border-radius:50%;background:#22c55e;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px}
    .balance{background:linear-gradient(135deg,#554315,#9b791b);border-radius:16px;padding:20px;margin-bottom:20px;color:white}
    .balance h1{font-size:32px;margin:8px 0}
    .card{background:#1e293b;border-radius:16px;padding:18px;margin-bottom:16px}
    .card h2{margin-bottom:12px;font-size:18px}
    button{width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;background:#22c55e;color:white}
    button:active{transform:scale(0.98)}
    #message{text-align:center;min-height:24px;margin:10px 0;color:#38bdf8}
    .nav{position:fixed;bottom:0;left:0;right:0;background:#1e293b;display:flex;padding:10px 0;border-top:1px solid #334155}
    .nav button{background:transparent;color:#94a3b8;flex:1;font-size:12px}
    .nav button.active{color:#22c55e}
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="logo">H</div>
        <div>
          <h2>Hamza Rewards</h2>
          <p style="font-size:13px;color:#94a3b8">Earn points & rewards</p>
        </div>
      </div>
      <div style="background:#1e293b;padding:6px 12px;border-radius:20px;font-size:13px">EN</div>
    </div>

    <div class="balance">
      <small>TOTAL BALANCE</small>
      <h1 id="points">0</h1>
      <p>★ Points available</p>
    </div>

    <div id="message"></div>

    <div class="card">
      <h2>▶ Watch Ads & Earn</h2>
      <p style="color:#94a3b8;margin-bottom:16px">Watch a short ad and earn 50 points</p>
      <button onclick="watchAd()">▶ Watch Ad → +50 Points</button>
      <p style="margin-top:12px;font-size:13px;color:#94a3b8">Today: <span id="adsToday">0</span> / 15 ads</p>
    </div>

    <div class="card">
      <h2>📋 Tasks</h2>
      <button onclick="claimTask(this,100)" style="margin-bottom:10px">Join Telegram → +100</button>
      <button onclick="dailyCheckin(this)">Daily Check-in → +50</button>
    </div>

    <div class="card">
      <h2>💰 Withdraw</h2>
      <p style="color:#94a3b8;margin-bottom:12px">Minimum 1000 points</p>
      <button onclick="withdraw()">Request Withdraw</button>
    </div>
  </div>

  <div class="nav">
    <button class="active">Ads</button>
    <button>Tasks</button>
    <button>Invite</button>
    <button>Withdraw</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let points = Number(localStorage.getItem("hamza_points")) || 0;
    let adsToday = Number(localStorage.getItem("hamza_ads_today")) || 0;
    const today = new Date().toDateString();
    if (localStorage.getItem("hamza_ads_date") !== today) {
      adsToday = 0;
      localStorage.setItem("hamza_ads_today", 0);
      localStorage.setItem("hamza_ads_date", today);
    }

    function updatePoints() {
      document.getElementById("points").textContent = points;
      document.getElementById("adsToday").textContent = adsToday;
      localStorage.setItem("hamza_points", points);
      localStorage.setItem("hamza_ads_today", adsToday);
    }

    function message(text) {
      document.getElementById("message").textContent = text;
      setTimeout(() => document.getElementById("message").textContent = "", 3000);
    }

    function preloadAd() {
      if (typeof show_11961014 !== "function") return;
      const ymid = String(tg.initDataUnsafe?.user?.id || "unknown");
      show_11961014({ type: "preload", ymid: ymid }).catch(() => {});
    }

    function watchAd() {
      if (typeof show_11961014 !== "function") {
        message("⚠️ Ad is not ready yet.");
        return;
      }
      if (adsToday >= 15) {
        message("⏰ Daily limit reached (15 ads)");
        return;
      }

      const ymid = String(tg.initDataUnsafe?.user?.id || "unknown");
      show_11961014({ ymid: ymid })
        .then(() => {
          points += 50;
          adsToday += 1;
          updatePoints();
          message("🎉 +50 points!");
          preloadAd();
        })
        .catch(() => {
          message("❌ No ads available right now. Try later.");
        });
    }

    function claimTask(btn, amount) {
      if (btn.dataset.done === "yes") {
        message("Task already completed");
        return;
      }
      points += amount;
      btn.dataset.done = "yes";
      btn.textContent = "✓ Done";
      updatePoints();
      message("🎉 +" + amount + " points!");
    }

    function dailyCheckin(btn) {
      const last = localStorage.getItem("hamza_checkin");
      if (last === today) {
        message("Already checked in today");
        return;
      }
      points += 50;
      localStorage.setItem("hamza_checkin", today);
      btn.textContent = "✓ Done";
      updatePoints();
      message("🎉 +50 points!");
    }

    function withdraw() {
      if (points < 1000) {
        message("❌ Minimum 1000 points required");
        return;
      }
      message("✅ Withdrawal request received!");
    }

    updatePoints();
    preloadAd();
  </script>
</body>
</html>
